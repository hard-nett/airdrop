# buf.yaml
version: v1
roots:
  - proto
name: buf.build/terpnetwork/zk-headstash
deps:
  - buf.build/googleapis/googleapis
  - buf.build/cosmos/gogo-proto
  - buf.build/cosmos/ibc:7ab44ae956a0488ea04e04511efa5f70
breaking:
  use:
    - FILE
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
lint:
  use:
    - DEFAULT
    - COMMENTS
    - FILE_LOWER_SNAKE_CASE
