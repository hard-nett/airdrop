[package]
name = "zk-test-press"
version = { workspace = true }
edition = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

# Binary targets with required features
[[bin]]
name = "gen_headstash_keys"
required-features = ["interface"]

[[bin]]
name = "create_headstash_proof"
required-features = ["interface"]

[[bin]]
name = "gen_headstash_notes"
