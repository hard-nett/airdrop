[package]
name = "zk-headstash"
version = {workspace = true}
edition = "2021"

[features]
default = ["circuit", "multicore", "std"]
multicore = ["halo2_proofs?/multicore"]
circuit = ["dep:halo2_gadgets", "dep:halo2_proofs", "std"]
std = ["core2/std", "group/wnaf-memuse", "reddsa/std"]
rpc = []

[dependencies]
headstash-randomness = { path = "../../pub-crates/randomness" }
plume_rustcrypto = {path = "../submodules/zk-nullifier-sig/rust-k256"}
halo2_gadgets = { path = "../submodules/halo2/halo2_gadgets",  optional = true, version = "0.3.1",   default-features = false ,features = ["test-dev-graph","test-dependencies"]  } 
halo2_proofs = { path = "../submodules/halo2/halo2_proofs", optional = true, version = "0.3.1" , default-features = false,features = ["test-dev-graph","gadget-traces", "dev-graph"]  } 
halo2-ecc = {path = "../submodules/halo2-lib/halo2-ecc"}
halo2-base = {path = "../submodules/halo2-lib/halo2-base"}

aes = "0.8"
base64 = "0.22.1"
bip39 = "2.2.0"
bitvec = { version = "1", default-features = false }
blake2b_simd = { version = "1", default-features = false }
blake3 = "1.8.2"
bls12_381 = "0.8.0"
core2 = { version = "0.3", default-features = false, features = ["alloc"] }
cosmwasm-std = { version = "3.0.0" }
elliptic-curve = { version = "0.13.8", features = ["hash2curve"] }
ff = "0.13"
fpe = { version = "0.6", default-features = false, features = ["alloc"] }
group = {workspace = true}
hex = "0.4.3"
hex-literal = "1.0.0"
hkdf = "0.12.4"
jubjub = { version = "0.10", default-features = false, features = ["alloc"] }
k256 = { version = "0.13.4", features = ["hash2curve"] }
lazy_static = "1"
memuse = { version = "0.2.2", default-features = false }
num-bigint = "0.4.6"
num-traits = "0.2.19"
pasta_curves = "0.5"
reddsa = { version = "0.5", default-features = false }
poseidon-rs = "0.0.8"
rand = "0.8"
rand_core = { version = "0.6", default-features = false }
rayon = "1.11.0"
secp256k1  = {workspace = true}
prost = { workspace = true }
tonic = {workspace = true }
tonic-prost = {workspace = true }

serde = { version = "1.0.228", features = ["derive"] } 
serde_json = "1.0.145"
sinsemilla = "0.1.0"
subtle = { version = "2.3", default-features = false }
zip32 = { version = "0.2.0", default-features = false }
sha3 = "0.10.8"
proptest = { version = ">=1.0.0, <1.7.0", optional = true }
nonempty = { version = "0.11", default-features = false }
zcash_note_encryption = "0.4"
incrementalmerkletree = "0.8.1"
zcash_spec = "0.2.1"
visibility = "0.1.1"

# Logging
tracing = { version = "0.1", default-features = false }
# Developer tooling dependencies
image = { version = "0.24", optional = true }
plotters = { version = "0.3.0", optional = true }
# Boilerplate
getset = "0.1"
 
[dev-dependencies]
criterion = "0.4" # 0.5 depends on clap 4 which has MSRV 1.70
halo2_gadgets = { path = "../submodules/halo2/halo2_gadgets",  version = "0.3.1", features = ["test-dependencies"] }
hex = "0.4"
proptest = ">=1.0.0, <1.7.0"
zcash_note_encryption = { version = "0.4", features = ["pre-zip-212"] }
incrementalmerkletree = { version = "0.8.1", features = ["test-dependencies"] }
shardtree = "0.6"

 