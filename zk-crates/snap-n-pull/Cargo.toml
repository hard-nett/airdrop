[package]
name = "snap-n-pull"
version = { workspace = true }
edition = { workspace = true }

# Define your features
[features]
default = ["wasm","common","keys","req","wallet"]
wasm = ["wasm-bindgen"]          # Enables WASM bindings generation
common = []         # Enables SnapCommonError
keys = []           # Enables SnapKeyError
req = []            # Enables SnapReqError
wallet = [] # Enables wallet features and pulls in its dependency

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "-O4"]

[lib]
crate-type = ["cdylib", "rlib"]


# Dependencies (marked as optional so they are only pulled with their feature)
[dependencies]
zk-headstash = { path = "../zk-headstash", features = ["rpc"] }
cosmos-sdk-proto  = { workspace = true }
group  = { workspace = true }

thiserror = { version = "1.0"  }
tokio = { version = "1.0", features = ["rt", "macros"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = "0.4.43"
wasm-bindgen-rayon = { version = "1.3" } # Update to higher version cause playwright test in chtomium fail
tracing = "0.1.40"
tracing-web = { version = "0.1.3" }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
serde  = { workspace = true }
serde-wasm-bindgen = "0.6.5"
tonic-web-wasm-client = "0.8"
js-sys = "0.3.82"
tonic = { workspace = true }
prost  = { workspace = true }
hex = "0.4.3"
sha3 = "0.10"
secp256k1 = { workspace = true, features = ["rand"] }
serde_json = "1.0"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.43"

[package.metadata.docs.rs]
all-features = true