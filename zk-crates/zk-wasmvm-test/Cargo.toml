[package]
name = "zk-wasmvm-test"
version = "0.2.0"
authors = ["A Hardnett"]
edition = "2024"


[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cosmwasm-std   = { workspace = true  }
cosmwasm-schema  = { workspace = true  }
cw-storage-plus  = { workspace = true  }
cw2 = { workspace = true  }
thiserror = { version = "2.0.16" }

[dev-dependencies]
cw-multi-test = { git = "https://github.com/permissionlessweb/cw-multi-test", branch = "mvp" , package = "cw-multi-test"}
