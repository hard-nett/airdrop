# Thin CosmwasmAuthenticator gate: raw-query ceremony module; no SSOT spent map.
[workspace]

[package]
name = "cw-nullifier-gate"
version = "0.1.0"
edition = "2021"
description = "Thin nullifier-gate authenticator: raw-query ceremony module + MarkSpent trigger"
license = "Apache-2.0"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []

[dependencies]
cosmwasm-schema = "1.5"
cosmwasm-std = { version = "1.5", features = ["iterator"] }
cw-storage-plus = "1.2"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
serde_json = "1.0"
