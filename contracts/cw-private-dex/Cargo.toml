[package]
name = "cw-private-dex"
version = { workspace = true }
edition = { workspace = true }
description = "Private DEX settle contract: mirrors private_dex_seams apply_swap_action with proof_instance_verify"
license = "Apache-2.0"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []
# cw-orch scripting / multi-test wrapper (host only; not for guest wasm).
interface = ["dep:cw-orch"]
# Enable only when the chain wasmvm exports env.proof_instance_verify.
# Pulls cosmwasm-std `zk` (injects the host import into guest wasm).
zk-api = ["cosmwasm-std/zk"]

[dependencies]
cosmwasm-schema = { workspace = true }
# Guest default: no `zk` feature (stock wasmd lacks proof_instance_verify).
# cosmwasm_2_1 kept for parity with headstash host floor.
cosmwasm-std = { workspace = true, features = ["cosmwasm_2_1"] }
cw-orch = { workspace = true, optional = true }
cw-ownable = { workspace = true }
cw-storage-plus = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
cw-multi-test = { workspace = true }
