# Standalone package (not a headstash workspace member) so `cargo test` stays light.
[workspace]

[package]
name = "cw-nullifier-auth"
version = "0.1.0"
edition = "2021"
description = "CosmwasmAuthenticator nullifier registry for smart-account double-spend prevention"
license = "Apache-2.0"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []
backtraces = ["cosmwasm-std/backtraces"]

[dependencies]
cosmwasm-schema = "1.5"
cosmwasm-std = { version = "1.5", features = ["iterator"] }
cw-storage-plus = "1.2"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
cw-multi-test = "0.20"
serde_json = "1.0"
