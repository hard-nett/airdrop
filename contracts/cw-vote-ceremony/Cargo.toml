# Standalone package so `cargo test` stays light (same pattern as cw-nullifier-auth).
[workspace]

[package]
name = "cw-vote-ceremony"
version = "0.1.0"
edition = "2021"
description = "DAO ceremony module: nullifier SSOT + ceremony lifecycle for vote-sdk-on-Terp"
license = "Apache-2.0"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []
backtraces = ["cosmwasm-std/backtraces"]

[dependencies]
cosmwasm-schema = "1.5"
cosmwasm-std = { version = "1.5", features = ["iterator"] }
cw-storage-plus = "1.2"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
serde_json = "1.0"
