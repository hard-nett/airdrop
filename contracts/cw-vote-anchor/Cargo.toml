# Standalone P0 anchor registry — session root map only (no depth-24 append).
[workspace]

[package]
name = "cw-vote-anchor"
version = "0.1.0"
edition = "2021"
description = "Vote commitment tree P0 on-chain anchor registry (session, height → root[32])"
license = "Apache-2.0"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []

[dependencies]
cosmwasm-schema = "1.5"
cosmwasm-std = { version = "1.5", features = ["iterator"] }
cw-storage-plus = "1.2"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
serde_json = "1.0"
